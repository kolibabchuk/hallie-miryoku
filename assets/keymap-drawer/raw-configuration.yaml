draw_config:
  key_w: 70
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: false
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: true
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: |-
    @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500');
    svg.keymap {
      font-family: "Source Code Pro", monospace;
      font-weight: 400;
    }
    /* Navy blue keys on light background */
    rect.key {
      fill: #1a2240 !important;
      stroke: #2a3460 !important;
    }
    rect.side {
      fill: #111832 !important;
      filter: none !important;
    }
    /* Light text on dark keys */
    svg.keymap .tap {
      font-size: 13px;
      fill: #e8eaf0 !important;
    }
    svg.keymap .hold {
      font-size: 10px;
      opacity: 0.7;
      fill: #c0c4d0 !important;
    }
    /* Layer activator hold legends - orange accent */
    svg.keymap text.layer-activator {
      fill: #E8952B !important;
      opacity: 1 !important;
      font-size: 11px !important;
      font-weight: 500 !important;
    }
    /* Enlarged single-symbol keys on non-base layers */
    /* Left homerow modifiers (13-16) - BUTTON, MOUSE, MEDIA, NUM only */
    [class*="layer-BUTTON"] .keypos-13 .tap,
    [class*="layer-BUTTON"] .keypos-14 .tap,
    [class*="layer-BUTTON"] .keypos-15 .tap,
    [class*="layer-BUTTON"] .keypos-16 .tap,
    [class*="layer-MOUSE"] .keypos-13 .tap,
    [class*="layer-MOUSE"] .keypos-14 .tap,
    [class*="layer-MOUSE"] .keypos-15 .tap,
    [class*="layer-MOUSE"] .keypos-16 .tap,
    [class*="layer-MEDIA"] .keypos-13 .tap,
    [class*="layer-MEDIA"] .keypos-14 .tap,
    [class*="layer-MEDIA"] .keypos-15 .tap,
    [class*="layer-MEDIA"] .keypos-16 .tap,
    /* Right homerow symbols (19-21) - all function layers */
    g[class*="layer-"]:not([class*="layer-BASE"]):not([class*="layer-EXTRA"]):not([class*="layer-TAP"]) .keypos-19 .tap,
    g[class*="layer-"]:not([class*="layer-BASE"]):not([class*="layer-EXTRA"]):not([class*="layer-TAP"]) .keypos-20 .tap,
    g[class*="layer-"]:not([class*="layer-BASE"]):not([class*="layer-EXTRA"]):not([class*="layer-TAP"]) .keypos-21 .tap,
    /* Position 22 (⌘) - NUM, SYM, FUN, BUTTON only */
    [class*="layer-NUM"] .keypos-22 .tap,
    [class*="layer-SYM"] .keypos-22 .tap,
    [class*="layer-FUN"] .keypos-22 .tap,
    [class*="layer-BUTTON"] .keypos-22 .tap,
    /* Position 8 - arrows on NAV, MOUSE */
    [class*="layer-NAV"] .keypos-8 .tap,
    [class*="layer-MOUSE"] .keypos-8 .tap,
    [class*="layer-MEDIA"] .keypos-8 .tap,
    /* Position 11 (ESC symbol) - all except BUTTON */
    [class*="layer-NAV"] .keypos-11 .tap,
    [class*="layer-MOUSE"] .keypos-11 .tap,
    [class*="layer-MEDIA"] .keypos-11 .tap,
    [class*="layer-NUM"] .keypos-11 .tap,
    [class*="layer-SYM"] .keypos-11 .tap,
    [class*="layer-FUN"] .keypos-11 .tap,
    /* Positions 17,18 (⊕) - BUTTON only */
    [class*="layer-BUTTON"] .keypos-17 .tap,
    [class*="layer-BUTTON"] .keypos-18 .tap,
    /* Position 26 (⌥) - NAV, MOUSE, MEDIA */
    [class*="layer-NAV"] .keypos-26 .tap,
    [class*="layer-MOUSE"] .keypos-26 .tap,
    [class*="layer-MEDIA"] .keypos-26 .tap,
    /* Position 33 (⌥) - NUM, SYM, FUN */
    [class*="layer-NUM"] .keypos-33 .tap,
    [class*="layer-SYM"] .keypos-33 .tap,
    [class*="layer-FUN"] .keypos-33 .tap,
    /* Position 35 (⊕) - all except BUTTON */
    [class*="layer-NAV"] .keypos-35 .tap,
    [class*="layer-MOUSE"] .keypos-35 .tap,
    [class*="layer-MEDIA"] .keypos-35 .tap,
    [class*="layer-NUM"] .keypos-35 .tap,
    [class*="layer-SYM"] .keypos-35 .tap,
    [class*="layer-FUN"] .keypos-35 .tap,
    /* Thumb symbols - typing layers */
    [class*="layer-BASE"] .keypos-36 .tap,
    [class*="layer-BASE"] .keypos-37 .tap,
    [class*="layer-BASE"] .keypos-38 .tap,
    [class*="layer-BASE"] .keypos-39 .tap,
    [class*="layer-BASE"] .keypos-40 .tap,
    [class*="layer-BASE"] .keypos-41 .tap,
    [class*="layer-EXTRA"] .keypos-36 .tap,
    [class*="layer-EXTRA"] .keypos-37 .tap,
    [class*="layer-EXTRA"] .keypos-38 .tap,
    [class*="layer-EXTRA"] .keypos-39 .tap,
    [class*="layer-EXTRA"] .keypos-40 .tap,
    [class*="layer-EXTRA"] .keypos-41 .tap,
    [class*="layer-TAP"] .keypos-36 .tap,
    [class*="layer-TAP"] .keypos-37 .tap,
    [class*="layer-TAP"] .keypos-38 .tap,
    [class*="layer-TAP"] .keypos-39 .tap,
    [class*="layer-TAP"] .keypos-40 .tap,
    [class*="layer-TAP"] .keypos-41 .tap,
    /* Thumb symbols - function layers */
    [class*="layer-FUN"] .keypos-37 .tap,
    [class*="layer-FUN"] .keypos-38 .tap,
    [class*="layer-NAV"] .keypos-39 .tap,
    [class*="layer-NAV"] .keypos-40 .tap,
    [class*="layer-NAV"] .keypos-41 .tap,
    [class*="layer-MEDIA"] .keypos-39 .tap,
    [class*="layer-MEDIA"] .keypos-40 .tap,
    [class*="layer-MEDIA"] .keypos-41 .tap {
      font-size: 26px !important;
    }
    /* Held key - pink accent showing layer activator */
    rect.held {
      fill: #4a1535 !important;
      stroke: #7b2858 !important;
    }
    /* Clean layer headers */
    svg.keymap text.label {
      font-family: "Source Code Pro", monospace;
      font-size: 18px;
      font-weight: 400;
      fill: #555e6e !important;
      paint-order: stroke;
      stroke: none !important;
    }
  footer_text: Hallie Keyboard - Miryoku Layout
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AltGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
