name: Build Hallie Miryoku Firmware

on:
  push:
    paths:
      - 'overlay/**'
      - 'assets/keymap-drawer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'overlay/**'
      - 'assets/keymap-drawer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      miryoku_zmk_repo:
        description: 'miryoku_zmk repository (user/repo)'
        default: 'manna-harbour/miryoku_zmk'
      miryoku_zmk_ref:
        description: 'miryoku_zmk branch/tag/SHA'
        default: '559aa4beae75cb3206ab411b7da2adb9665c6896'
      zmk_ref:
        description: 'ZMK firmware branch/tag (zmkfirmware/zmk)'
        default: 'v0.3.0'
      keyboards_repo:
        description: 'Hallie board module repository (user/repo)'
        default: 'SplittedSpace/zmk-keyboards-splittedspace'
      keyboards_ref:
        description: 'Hallie board module branch/tag/SHA'
        default: 'e83cb6caf022f256bb94747607d6ab084d2580bc'
      feature_repo:
        description: 'Hallie feature module repository (user/repo)'
        default: 'SplittedSpace/zmk-feature-splittedspace'
      feature_ref:
        description: 'Hallie feature module branch/tag/SHA'
        default: 'fa2bf40cd5f375ad9856fd4d1266ae9d1d0c2055'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned to the stable manifest-list digest pushed 2025-10-03. Unpinning
      # is as simple as dropping the @sha256:... suffix.
      image: zmkfirmware/zmk-build-arm:stable@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    strategy:
      fail-fast: false
      matrix:
        board: [hallie_left, hallie_right]
    env:
      MIRYOKU_ZMK_REPO: ${{ inputs.miryoku_zmk_repo || 'manna-harbour/miryoku_zmk' }}
      MIRYOKU_ZMK_REF: ${{ inputs.miryoku_zmk_ref || '559aa4beae75cb3206ab411b7da2adb9665c6896' }}
      ZMK_REF: ${{ inputs.zmk_ref || 'v0.3.0' }}
      KEYBOARDS_REPO: ${{ inputs.keyboards_repo || 'SplittedSpace/zmk-keyboards-splittedspace' }}
      KEYBOARDS_REF: ${{ inputs.keyboards_ref || 'e83cb6caf022f256bb94747607d6ab084d2580bc' }}
      FEATURE_REPO: ${{ inputs.feature_repo || 'SplittedSpace/zmk-feature-splittedspace' }}
      FEATURE_REF: ${{ inputs.feature_ref || 'fa2bf40cd5f375ad9856fd4d1266ae9d1d0c2055' }}
    steps:
      - name: Checkout layout config
        uses: actions/checkout@v6
        with:
          path: layout

      - name: Checkout miryoku_zmk
        run: |
          git init miryoku_zmk
          cd miryoku_zmk
          git remote add origin "https://github.com/$MIRYOKU_ZMK_REPO.git"
          git fetch --depth 1 origin "$MIRYOKU_ZMK_REF"
          git checkout FETCH_HEAD

      - name: Overlay layout files onto miryoku_zmk
        run: |
          echo "::group::Overlay layout files"

          # Hallie keymap
          cp layout/overlay/config/hallie.keymap miryoku_zmk/config/hallie.keymap

          # Core files with 3-arg MIRYOKU_X for encoder support
          cp layout/overlay/miryoku/miryoku.dtsi miryoku_zmk/miryoku/miryoku.dtsi
          cp layout/overlay/miryoku/miryoku_double_tap_guard.dtsi miryoku_zmk/miryoku/miryoku_double_tap_guard.dtsi

          # Custom config (per-layer mapping aliases + extra includes)
          cp layout/overlay/miryoku/custom_config.h miryoku_zmk/miryoku/custom_config.h

          # Custom behaviors (Globe, Hyper, input switch)
          cp layout/overlay/miryoku/miryoku_behaviors.dtsi miryoku_zmk/miryoku/miryoku_behaviors.dtsi
          cp layout/overlay/miryoku/miryoku_behaviors.h miryoku_zmk/miryoku/miryoku_behaviors.h

          # 42-key physical layout mapping
          mkdir -p miryoku_zmk/miryoku/mapping/42
          cp layout/overlay/miryoku/mapping/42/hallie.h miryoku_zmk/miryoku/mapping/42/hallie.h

          # Layer list with encoder bindings
          cp layout/overlay/miryoku/miryoku_babel/miryoku_layer_list.h miryoku_zmk/miryoku/miryoku_babel/miryoku_layer_list.h

          echo "::endgroup::"

      - name: Assemble config defines
        run: |
          echo "::group::Config defines"

          configfile="miryoku_zmk/miryoku/custom_config.h"
          tmpfile=$(mktemp)

          # Keyboard identifier (required by miryoku)
          echo '#define MIRYOKU_KEYBOARD_HALLIE' > "$tmpfile"

          # Miryoku options — edit these to change layout preferences
          echo '#define MIRYOKU_NAV_INVERTEDT' >> "$tmpfile"
          echo '#define MIRYOKU_CLIPBOARD_MAC' >> "$tmpfile"

          # Append the rest of custom_config.h
          cat "$configfile" >> "$tmpfile"
          mv "$tmpfile" "$configfile"

          cat "$configfile"
          echo "::endgroup::"

      - name: Create board Kconfig overrides
        run: |
          echo "::group::Kconfig"

          conffile="miryoku_zmk/config/${{ matrix.board }}.conf"

          # Common settings for both halves
          echo 'CONFIG_ZMK_STUDIO=n' >> "$conffile"
          echo 'CONFIG_ZMK_POINTING=y' >> "$conffile"
          echo 'CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000' >> "$conffile"
          echo 'CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y' >> "$conffile"

          # Apple VID/PID for Globe key (left half only — it has USB)
          if [ "${{ matrix.board }}" = "hallie_left" ]; then
            echo 'CONFIG_USB_DEVICE_VID=0x05AC' >> "$conffile"
            echo 'CONFIG_USB_DEVICE_PID=0x0267' >> "$conffile"
          fi

          cat "$conffile"
          echo "::endgroup::"

      - name: Clone ZMK firmware
        run: |
          git init zmk
          cd zmk
          git remote add origin "https://github.com/zmkfirmware/zmk.git"
          git fetch --depth 1 origin "$ZMK_REF"
          git checkout FETCH_HEAD

      - name: Clone vendor modules
        run: |
          git init zmk-keyboards
          cd zmk-keyboards
          git remote add origin "https://github.com/$KEYBOARDS_REPO.git"
          git fetch --depth 1 origin "$KEYBOARDS_REF"
          git checkout FETCH_HEAD
          cd ..

          git init zmk-feature
          cd zmk-feature
          git remote add origin "https://github.com/$FEATURE_REPO.git"
          git fetch --depth 1 origin "$FEATURE_REF"
          git checkout FETCH_HEAD

      - name: Cache Zephyr modules
        uses: actions/cache@v5
        with:
          path: |
            zmk/modules/
            zmk/zephyr/
          key: zephyr-${{ runner.os }}-${{ hashFiles('zmk/app/west.yml') }}
        timeout-minutes: 2
        continue-on-error: true

      - name: Setup west workspace
        run: |
          echo "::group::West setup"
          cd zmk
          west init -l app
          west update
          west zephyr-export
          echo "::endgroup::"

      - name: Build firmware
        run: |
          echo "::group::Build ${{ matrix.board }}"
          cd zmk/app
          west build -b ${{ matrix.board }} -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/miryoku_zmk/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboards;${GITHUB_WORKSPACE}/zmk-feature"
          echo "::endgroup::"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          for ext in uf2 bin hex; do
            file="zmk/app/build/zephyr/zmk.$ext"
            if [ -f "$file" ]; then
              cp "$file" "artifacts/${{ matrix.board }}.${ext}"
              break
            fi
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: hallie-${{ matrix.board }}
          path: artifacts/

  draw-keymap:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIRYOKU_ZMK_REF: 559aa4beae75cb3206ab411b7da2adb9665c6896
      FEATURE_REF: fa2bf40cd5f375ad9856fd4d1266ae9d1d0c2055
    steps:
      - name: Checkout main for overlay + layout-override.json
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout assets branch
        uses: actions/checkout@v6
        with:
          ref: assets
          path: assets

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      # Replicate the build job's overlay assembly so keymap-drawer sees the
      # same keymap the firmware would. We can't feed it Zephyr's preprocessed
      # output — its ZMK parser runs its own cpp and expects a .keymap source.
      - name: Clone upstream miryoku_zmk
        run: |
          git init miryoku_zmk
          cd miryoku_zmk
          git remote add origin https://github.com/manna-harbour/miryoku_zmk.git
          git fetch --depth 1 origin "$MIRYOKU_ZMK_REF"
          git checkout FETCH_HEAD

      - name: Clone SplittedSpace feature module (for &ind behavior includes)
        run: |
          git init zmk-feature
          cd zmk-feature
          git remote add origin https://github.com/SplittedSpace/zmk-feature-splittedspace.git
          git fetch --depth 1 origin "$FEATURE_REF"
          git checkout FETCH_HEAD

      - name: Overlay layout files onto miryoku_zmk
        run: |
          cp main/overlay/config/hallie.keymap          miryoku_zmk/config/hallie.keymap
          cp main/overlay/miryoku/miryoku.dtsi          miryoku_zmk/miryoku/miryoku.dtsi
          cp main/overlay/miryoku/miryoku_double_tap_guard.dtsi miryoku_zmk/miryoku/miryoku_double_tap_guard.dtsi
          cp main/overlay/miryoku/custom_config.h       miryoku_zmk/miryoku/custom_config.h
          cp main/overlay/miryoku/miryoku_behaviors.dtsi miryoku_zmk/miryoku/miryoku_behaviors.dtsi
          cp main/overlay/miryoku/miryoku_behaviors.h   miryoku_zmk/miryoku/miryoku_behaviors.h
          mkdir -p miryoku_zmk/miryoku/mapping/42
          cp main/overlay/miryoku/mapping/42/hallie.h   miryoku_zmk/miryoku/mapping/42/hallie.h
          cp main/overlay/miryoku/miryoku_babel/miryoku_layer_list.h miryoku_zmk/miryoku/miryoku_babel/miryoku_layer_list.h

      - name: Write keymap-drawer config
        run: |
          # Important: do NOT include zmk/app/include or zmk/app/dts.
          # keymap-drawer's preprocessor passes through unresolved includes
          # (pcpp IgnoreAndPassThrough), which keeps ZMK keycodes like LGUI /
          # C_VOL_UP / SCRL_LEFT as symbolic names that zmk_keycode_map can
          # display. Resolving them would expand to raw hex, bypassing the map.
          cat > kd_config.yaml <<'EOF'
          parse_config:
            preprocess: true
            zmk_preamble: |
              #define KEYMAP_DRAWER
              #define MIRYOKU_KEYBOARD_HALLIE
              #define MIRYOKU_NAV_INVERTEDT
              #define MIRYOKU_CLIPBOARD_MAC
            zmk_additional_includes:
              - miryoku_zmk/miryoku
              - miryoku_zmk
              - zmk-feature/dts
              - zmk-feature/include
          EOF

      - name: Parse and draw
        run: |
          keymap -c kd_config.yaml parse -z miryoku_zmk/config/hallie.keymap > /tmp/parsed.yaml
          keymap draw \
            -j main/assets/keymap-drawer/layout-override.json \
            -l LAYOUT_hallie \
            /tmp/parsed.yaml \
            > assets/keymap.svg

      - name: Commit SVG to assets branch
        working-directory: assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap.svg
          if git diff --staged --quiet; then
            echo "No SVG changes"
          else
            git commit -m "chore: regenerate keymap SVG [skip ci]"
            git push
          fi
